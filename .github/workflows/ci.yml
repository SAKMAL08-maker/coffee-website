name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - version_1.0
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint backend and tests
        run: npx --yes eslint@9.36.0 server.js config controllers middleware routes schemas services test
      - name: Check configuration formatting
        run: npx --yes prettier@3.6.2 --check .github/workflows/ci.yml .prettierrc.json
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
