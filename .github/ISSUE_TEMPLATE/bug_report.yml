name: Bug report
description: Something in Coffee Lab is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste passwords, API keys, session cookies, TOTP codes, or customer personal data.**
        For security vulnerabilities, contact the maintainer privately instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Choose pickup / delivery ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drink customizer
        - Cart / checkout / pricing
        - Order tracking / history
        - Receipts
        - Customer login / signup
        - Admin dashboard / MFA
        - Deployment / infrastructure
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where?
      options:
        - Production (Render)
        - Local development
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Browser console or server log lines, with any secrets removed.
      render: text
