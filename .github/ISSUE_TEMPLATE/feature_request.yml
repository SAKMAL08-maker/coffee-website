name: Feature request
description: Suggest an improvement or new feature for Coffee Lab.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is this for, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Mockups or examples welcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it's done?
      placeholder: |
        - [ ] ...
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Needs a database migration
        - label: Changes pricing or payments
        - label: Touches authentication or admin access
